[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amr-mcp"
version = "0.1.1"
description = "MCP server for antimicrobial resistance (AMR) data: NCBI Reference Gene Catalog, NCBI E-utilities and UniProt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "bioinformatics", "antimicrobial-resistance", "amr", "ncbi", "uniprot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/pabloestepaa/amr-mcp"
Issues = "https://github.com/pabloestepaa/amr-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
amr-mcp = "amr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amr_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: hits live NCBI/UniProt APIs (deselect with -m 'not network')"]
